@font-face{font-family:JB;src:url(/assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:OF;src:url(/assets/fonts/Outfit-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
html,body{height:100%;margin:0;background:#030304;color:#ecebe6}
body{display:grid;place-items:center;font-family:JB,ui-monospace,Menlo,monospace;overflow:hidden}
main{display:grid;justify-items:center;gap:18px;text-align:center;padding:24px}
svg{width:120px;height:120px;overflow:visible}
.h{fill:#000;stroke:#e9e7e2;stroke-width:1.4}.s{fill:#e9e7e2}
.r{fill:none;stroke:rgba(233,231,226,.16);stroke-width:1;transform-origin:center;animation:r 3.2s ease-out infinite}
@keyframes r{0%{transform:scale(.7);opacity:0}30%{opacity:1}100%{transform:scale(1.35);opacity:0}}
h1{margin:6px 0 0;font:700 clamp(54px,12vw,96px)/1 OF,ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em}
h1 i{font-style:normal;position:relative;display:inline-block}
h1 i::after{content:"";position:absolute;left:50%;top:50%;width:.085em;height:62%;background:currentColor;transform:translate(-50%,-50%) rotate(38deg);border-radius:2px}
p{margin:0;color:#8b8a85;font-size:13px;letter-spacing:.04em}
a{margin-top:10px;color:#ecebe6;font-size:12.5px;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:9px 16px;transition:border-color .2s,background .2s}
a:hover{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.05)}
@media (prefers-reduced-motion:reduce){.r{animation:none}}
</style>
